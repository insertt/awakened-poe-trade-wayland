name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.29.108). Leave empty to use <branch>-<commit hash>.'
        required: false
        type: string
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        required: false
        type: boolean
        default: false

jobs:
  appimage:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6

    - run: npm ci
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer

    - run: npm ci
      working-directory: ./main
    - run: npm run build
      working-directory: ./main
    - run: npm run package "--" --linux AppImage -p never '-c.linux.artifactName=${name}-${version}-Wayland.${ext}'
      working-directory: ./main

    - run: cat ./main/dist/latest-linux.yml

    - name: Upload AppImage
      uses: actions/upload-artifact@v7
      with:
        path: ./main/dist/*.AppImage
        archive: false

    - name: Upload update metadata
      uses: actions/upload-artifact@v7
      with:
        path: ./main/dist/latest-linux.yml
        archive: false

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        INPUT_TAG: ${{ inputs.tag }}
        PRERELEASE: ${{ inputs.prerelease }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ -n "$INPUT_TAG" ]; then
          name="$INPUT_TAG"
        else
          # No tag given: name the release after the branch and commit hash
          name="$(echo "$REF_NAME" | tr '/' '-')-$(git rev-parse --short HEAD)"
        fi
        args=()
        if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
        gh release create "$name" \
          --target "$GITHUB_SHA" \
          --title "$name" \
          --generate-notes \
          "${args[@]}" \
          ./main/dist/*.AppImage \
          ./main/dist/latest-linux.yml
